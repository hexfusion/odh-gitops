# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/certs/ca-bootstrap-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grid-enrollment-ca-bootstrap
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  # create cannot be resourceName-scoped (the object does not exist yet).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/update restricted to exactly the three Secrets the bootstrap manages,
  # so this SA cannot read any other Secret in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "grid-ca-key"
      - "grid-ca-bundle"
      - "enrollment-serving-tls"
    verbs: ["get", "update"]

