# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/certs/ca-bootstrap-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-enrollment-ca-bootstrap-1
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ca-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # Keep the succeeded Job (deleted before the next install) so its logs are
    # collectable for the smoke/e2e panic-scan.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
    spec:
      restartPolicy: Never
      serviceAccountName: grid-enrollment-ca-bootstrap
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ca-bootstrap
          image: "quay.io/praxis-proxy/grid-enrollment:v0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command: ["enrollment", "bootstrap"]
          args:
            - "--namespace"
            - "default"
            - "--common-name"
            - "grid-ca"
            - "--ca-key-secret"
            - "grid-ca-key"
            - "--ca-bundle-secret"
            - "grid-ca-bundle"
            - "--serving-secret"
            - "enrollment-serving-tls"
            - "--serving-dns"
            - "grid-enrollment.default.svc"

