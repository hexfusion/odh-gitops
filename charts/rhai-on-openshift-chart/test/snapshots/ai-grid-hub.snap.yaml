# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/enrollment/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-enrollment
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: enrollment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/component: enrollment
    spec:
      serviceAccountName: grid-enrollment
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrollment
          image: "quay.io/praxis-proxy/grid-enrollment:v0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # CA signing material (file paths; read via std::fs). Key is mounted
            # ONLY into this pod, never the gateway.
            - name: ENROLLMENT_CA_CERT
              value: /etc/grid-ca/tls.crt
            - name: ENROLLMENT_CA_KEY
              value: /etc/grid-ca/tls.key
            - name: ENROLLMENT_CA_COMMON_NAME
              value: "grid-ca"
            # In-process TLS serving cert (file paths).
            - name: ENROLLMENT_TLS_CERT
              value: /etc/grid-tls/tls.crt
            - name: ENROLLMENT_TLS_KEY
              value: /etc/grid-tls/tls.key
            - name: ENROLLMENT_LISTEN_ADDR
              value: "0.0.0.0:8443"
            - name: ENROLLMENT_AUTHZ
              value: "kube"
            - name: DB_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: maas-db-config
                  key: DB_CONNECTION_URL
          volumeMounts:
            - name: grid-ca
              mountPath: /etc/grid-ca
              readOnly: true
            - name: grid-tls
              mountPath: /etc/grid-tls
              readOnly: true
      volumes:
        # Signing key + cert. This is the only pod that mounts grid-ca-key.
        - name: grid-ca
          secret:
            secretName: grid-ca-key
        - name: grid-tls
          secret:
            secretName: enrollment-serving-tls

